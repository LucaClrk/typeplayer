<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>typeplayer</title>
    <link rel="stylesheet" href="styles/main.css">
</head>
<body>
<main class="tty">
    <p class="dim">typeplayer (tty1)</p>
    <br>
    <p>[guest@arch ~]$ typeplayer --time <span id="duration"></span></p>
    <p class="dim">time <button type="button" data-duration="30"></button><button type="button" data-duration="60"></button></p>
    <p class="text" id="text"></p>
    <p class="dim" id="status"></p>
    <pre id="results" role="status" hidden></pre>
</main>
<script src="app.js"></script>
</body>
</html>
